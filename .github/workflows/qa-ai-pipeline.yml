name: AI-QA Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test-and-heal:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push healed changes back
    env:
      # If you use Groq anywhere else (e.g. generate_test.py) make sure the secret exists
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      # -------------------------------------------------
      # 1️⃣ Checkout code
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------
      # 2️⃣ Set up Python + cache deps
      # -------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      # -------------------------------------------------
      # 3️⃣ Install & start Ollama (local LLM)
      # -------------------------------------------------
      - name: Install Ollama
        run: |
          curl -L https://ollama.com/install.sh | sudo bash

      - name: Start Ollama daemon
        # Run Ollama as a background service for the whole job
        run: |
          sudo systemctl start ollama
          # Wait until the socket is ready
          for i in {1..10}; do
            if ollama list | grep -q qwen2.5-coder; then break; fi
            sleep 2
          done

      - name: Pull required model
        run: |
          ollama pull qwen2.5-coder:3b

      # --------------------------------------------------------------
      # 2️⃣ **Generate a test from a description** – runs before the test suite
      # --------------------------------------------------------------
      - name: Generate test from description
        run: |
            python scripts/generate_test.py "test that the page has a heading containing 'Example'"

      # -------------------------------------------------
      # 4️⃣ Run pytest with self-healing enabled
      # -------------------------------------------------
      - name: Run tests (with healing)
        id: test
        continue-on-error: true               # <-- allow failures for healing
        run: |
          pytest tests/
        # The default pytest.ini already injects the required --llm-provider flags

      # -------------------------------------------------
      # 5️⃣ Apply healed selectors back to source files
      # -------------------------------------------------
      - name: Apply healed selectors
        id: apply
        run: |
          python scripts/apply_healed_selectors.py --test tests/test_generated.py
        # The script returns exit-code 0 even if nothing changed;
        # we capture the number of modified files for the next step.

      # -------------------------------------------------
      # 6️⃣ Run pytest again (should be green after healing)
      # -------------------------------------------------
      - name: Run tests (second run - expect success)
        id: test_second
        run: |
          pytest tests/

      # -------------------------------------------------
      # 6️⃣ Commit healed files (if any)
      # -------------------------------------------------
      - name: Check for modified files
        id: gitdiff
        run: |
          git diff --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push healed selectors
        if: steps.gitdiff.outputs.changed == 'true'
        env:
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: github-actions@github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add .
          git commit -m "🤖 Apply healed selectors from CI run"
          git push

      # -------------------------------------------------
      # 7️⃣ Upload healing reports (optional, for debugging)
      # -------------------------------------------------
      - name: Upload healing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healing-reports
          path: reports/*.json
          retention-days: 7